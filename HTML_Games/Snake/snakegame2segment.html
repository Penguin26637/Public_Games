<!DOCTYPE html>
<html>
<head>
    <title>Pro Snake - Multi-Apple & Pause</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
        .ui { margin-bottom: 15px; text-align: center; background: #333; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        .scores { font-size: 22px; color: #4CAF50; font-weight: bold; margin-bottom: 10px; }
        canvas { border: 5px solid #555; background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        select, button { padding: 8px; background: #444; color: white; border: 1px solid #666; border-radius: 4px; cursor: pointer; margin: 5px; }
        .controls { color: #888; font-size: 13px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="ui">
        <div class="scores">Score: <span id="score">0</span> | Best: <span id="highScore">0</span></div>
        
        <label>Difficulty: </label>
        <select id="mode">
            <option value="150">Easy</option>
            <option value="100" selected>Normal</option>
            <option value="60">Hard</option>
        </select>

        <label>Field: </label>
        <select id="fieldSize">
            <option value="300">Small</option>
            <option value="400" selected>Medium</option>
            <option value="600">Large</option>
        </select>

        <label>Apples: </label>
        <select id="appleCount">
            <option value="1" selected>1</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="10">10</option>
        </select>

        <button onclick="resetGame()">Restart</button>
    </div>

    <div style="position: relative;">
        <canvas id="snakeGame"></canvas>
    </div>
    <div id="status" class="controls">ARROWS/WASD TO START • SPACE TO PAUSE</div>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const box = 20;
        
        let score, highScore, snake, apples, direction, gameLoop, isPaused;
        let inputQueue = [];

        highScore = localStorage.getItem("snakeHighScore") || 0;
        document.getElementById("highScore").innerText = highScore;

        function resetGame() {
            clearInterval(gameLoop);
            const size = parseInt(document.getElementById("fieldSize").value);
            canvas.width = size;
            canvas.height = size;
            
            score = 0;
            isPaused = false;
            document.getElementById("score").innerText = score;
            document.getElementById("status").innerText = "ARROWS/WASD TO START • SPACE TO PAUSE";
            
            direction = null; 
            inputQueue = [];
            apples = [];

            const startX = Math.floor(canvas.width / (2 * box)) * box;
            const startY = Math.floor(canvas.height / (2 * box)) * box;
            
            snake = [
                { x: startX, y: startY },
                { x: startX, y: startY + box }
            ];

            const count = parseInt(document.getElementById("appleCount").value);
            for(let i=0; i < count; i++) spawnFood();

            gameLoop = setInterval(gameStep, document.getElementById("mode").value);
        }

        function spawnFood() {
            const cols = canvas.width / box;
            const rows = canvas.height / box;
            let newFood;
            let collision;
            do {
                collision = false;
                newFood = {
                    x: Math.floor(Math.random() * cols) * box,
                    y: Math.floor(Math.random() * rows) * box
                };
                if (snake.some(p => p.x === newFood.x && p.y === newFood.y)) collision = true;
                if (apples.some(a => a.x === newFood.x && a.y === newFood.y)) collision = true;
            } while (collision);
            apples.push(newFood);
        }

        document.addEventListener("keydown", e => {
            // Space to Pause
            if (e.keyCode === 32) {
                e.preventDefault();
                if (direction) { // Only pause if game has started
                    isPaused = !isPaused;
                    document.getElementById("status").innerText = isPaused ? "GAME PAUSED - PRESS SPACE TO RESUME" : "PLAYING...";
                }
                return;
            }

            const keys = {37:"LEFT", 38:"UP", 39:"RIGHT", 40:"DOWN", 65:"LEFT", 87:"UP", 68:"RIGHT", 83:"DOWN"};
            const pressed = keys[e.keyCode];
            if (!pressed || isPaused) return;
            e.preventDefault();
            
            const lastD = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : direction;
            if (pressed === "LEFT" && lastD !== "RIGHT") inputQueue.push("LEFT");
            else if (pressed === "UP" && lastD !== "DOWN") inputQueue.push("UP");
            else if (pressed === "RIGHT" && lastD !== "LEFT") inputQueue.push("RIGHT");
            else if (pressed === "DOWN" && lastD !== "UP") inputQueue.push("DOWN");
            document.getElementById("status").innerText = "PLAYING...";
        });

        function gameStep() {
            if (isPaused) {
                draw();
                // Draw Pause Text
                ctx.fillStyle = "white";
                ctx.font = "30px Segoe UI";
                ctx.textAlign = "center";
                ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
                return;
            }

            if (inputQueue.length > 0) direction = inputQueue.shift();
            if (!direction) { draw(); return; }

            let headX = snake[0].x;
            let headY = snake[0].y;

            if (direction === "LEFT") headX -= box;
            if (direction === "UP") headY -= box;
            if (direction === "RIGHT") headX += box;
            if (direction === "DOWN") headY += box;

            const hitWall = headX < 0 || headX >= canvas.width || headY < 0 || headY >= canvas.height;
            const hitSelf = snake.some(part => part.x === headX && part.y === headY);

            if (hitWall || hitSelf) {
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    document.getElementById("highScore").innerText = highScore;
                }
                alert("Game Over! Score: " + score);
                resetGame();
                return;
            }

            const newHead = { x: headX, y: headY };
            const appleIndex = apples.findIndex(a => a.x === headX && a.y === headY);

            if (appleIndex !== -1) {
                score++;
                document.getElementById("score").innerText = score;
                apples.splice(appleIndex, 1);
                spawnFood();
            } else {
                snake.pop();
            }

            snake.unshift(newHead);
            draw();
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            apples.forEach(apple => {
                ctx.fillStyle = "#FF5252";
                ctx.fillRect(apple.x + 2, apple.y + 2, box - 4, box - 4);
            });

            snake.forEach((part, i) => {
                ctx.fillStyle = i === 0 ? "#4CAF50" : "#2E7D32";
                ctx.fillRect(part.x, part.y, box - 1, box - 1);
                if (i === 0 && direction) {
                    ctx.fillStyle = "white";
                    if (direction === "UP" || direction === "DOWN") {
                        ctx.fillRect(part.x + 4, part.y + 8, 4, 4);
                        ctx.fillRect(part.x + 12, part.y + 8, 4, 4);
                    } else {
                        ctx.fillRect(part.x + 8, part.y + 4, 4, 4);
                        ctx.fillRect(part.x + 8, part.y + 12, 4, 4);
                    }
                }
            });
        }

        ["mode", "fieldSize", "appleCount"].forEach(id => {
            document.getElementById(id).addEventListener("change", resetGame);
        });

        resetGame();
    </script>
</body>
</html>
