<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2048 - Fixed & Final</title>
    <style>
        :root {
            --bg-color: #faf8ef; --container-bg: #bbada0; --cell-bg: #cdc1b5;
            --text-dark: #776e65; --text-light: #f9f6f2;
            --grid-size: 400px; --cell-size: 85px; --gap: 12px;
        }
        body {
            background-color: var(--bg-color); color: var(--text-dark);
            font-family: "Clear Sans", Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; margin: 0; justify-content: center;
        }
        .header { width: var(--grid-size); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .score-box { background: var(--container-bg); padding: 5px 20px; border-radius: 6px; color: white; text-align: center; }
        
        #game-container {
            width: var(--grid-size); height: var(--grid-size);
            background: var(--container-bg); border-radius: 6px;
            position: relative; padding: var(--gap); box-sizing: border-box;
        }
        .background-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap);
            width: 100%; height: 100%;
        }
        .bg-cell { background: var(--cell-bg); border-radius: 3px; }

        .tile {
            width: var(--cell-size); height: var(--cell-size);
            position: absolute; border-radius: 3px;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 35px;
            transition: transform 100ms ease-in-out; z-index: 10;
        }

        /* Colors */
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: white; }
        .tile-16 { background: #f59563; color: white; }
        .tile-32 { background: #f67c5f; color: white; }
        .tile-64 { background: #f65e3b; color: white; }
        .tile-128 { background: #edcf72; color: white; font-size: 30px; }
        .tile-256 { background: #edcc61; color: white; font-size: 30px; }
        .tile-512 { background: #edc850; color: white; font-size: 30px; }
        .tile-1024 { background: #edc53f; color: white; font-size: 24px; }
        .tile-2048 { background: #edc22e; color: white; font-size: 24px; }

        #game-over {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(238, 228, 218, 0.73); z-index: 100;
            display: none; flex-direction: column; align-items: center;
            justify-content: center; border-radius: 6px;
        }
        .retry-btn {
            background: #8f7a66; color: white; border: none;
            padding: 10px 20px; border-radius: 3px; cursor: pointer;
            font-weight: bold; font-size: 18px; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="margin:0; font-size: 48px;">2048</h1>
        <div class="score-box"><b>Score</b><br><span id="score">0</span></div>
    </div>
    <div id="game-container">
        <div id="game-over">
            <h1 style="font-size: 60px; margin: 0;">Game Over!</h1>
            <button class="retry-btn" onclick="resetGame()">Try Again</button>
        </div>
        <div class="background-grid">
            <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
            <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
            <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
            <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
        </div>
        <div id="tile-container"></div>
    </div>
    <p>Use <b>WASD</b> or <b>Arrows</b> to merge tiles.</p>

    <script>
        let board = Array(16).fill(0);
        let score = 0;
        const container = document.getElementById('tile-container');

        function getPos(i) {
            const row = Math.floor(i / 4);
            const col = i % 4;
            return {
                x: 12 + (col * (85 + 12)),
                y: 12 + (row * (85 + 12))
            };
        }

        function draw() {
            container.innerHTML = '';
            board.forEach((val, i) => {
                if (val > 0) {
                    const tile = document.createElement('div');
                    tile.className = `tile tile-${val}`;
                    tile.textContent = val;
                    const {x, y} = getPos(i);
                    tile.style.left = x + 'px';
                    tile.style.top = y + 'px';
                    container.appendChild(tile);
                }
            });
            document.getElementById('score').textContent = score;
            checkGameOver();
        }

        function addRandom() {
            let empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if (empty.length) board[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < 0.9 ? 2 : 4;
        }

        function checkGameOver() {
            if (board.includes(0)) return;
            for (let i = 0; i < 16; i++) {
                if (i % 4 < 3 && board[i] === board[i+1]) return;
                if (i < 12 && board[i] === board[i+4]) return;
            }
            document.getElementById('game-over').style.display = 'flex';
        }

        function resetGame() {
            board = Array(16).fill(0); score = 0;
            document.getElementById('game-over').style.display = 'none';
            addRandom(); addRandom(); draw();
        }

        function move(dir) {
            let old = JSON.stringify(board);
            for (let i = 0; i < 4; i++) {
                let row = [];
                for (let j = 0; j < 4; j++) {
                    if (dir === 'left') row.push(board[i*4 + j]);
                    else if (dir === 'right') row.push(board[i*4 + (3-j)]);
                    else if (dir === 'up') row.push(board[j*4 + i]);
                    else if (dir === 'down') row.push(board[(3-j)*4 + i]);
                }
                let filtered = row.filter(v => v !== 0);
                for (let j = 0; j < filtered.length - 1; j++) {
                    if (filtered[j] === filtered[j+1]) {
                        filtered[j] *= 2; score += filtered[j]; filtered.splice(j+1, 1);
                    }
                }
                while (filtered.length < 4) filtered.push(0);
                for (let j = 0; j < 4; j++) {
                    if (dir === 'left') board[i*4 + j] = filtered[j];
                    else if (dir === 'right') board[i*4 + (3-j)] = filtered[j];
                    else if (dir === 'up') board[j*4 + i] = filtered[j];
                    else if (dir === 'down') board[(3-j)*4 + i] = filtered[j];
                }
            }
            if (old !== JSON.stringify(board)) { addRandom(); draw(); }
        }

        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (['arrowleft', 'a'].includes(k)) move('left');
            if (['arrowright', 'd'].includes(k)) move('right');
            if (['arrowup', 'w'].includes(k)) move('up');
            if (['arrowdown', 's'].includes(k)) move('down');
        });

        resetGame();
    </script>
</body>
</html>
